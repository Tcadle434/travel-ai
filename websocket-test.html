<!doctype html>
<html>
	<head>
		<title>WebSocket Test</title>
		<script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
			}
			#messages {
				border: 1px solid #ccc;
				height: 300px;
				overflow-y: auto;
				padding: 10px;
				margin-bottom: 10px;
			}
			#message-form {
				display: flex;
			}
			#message-input {
				flex-grow: 1;
				margin-right: 10px;
				padding: 8px;
			}
			button {
				padding: 8px 15px;
				background-color: #4caf50;
				color: white;
				border: none;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<h1>WebSocket Test</h1>

		<button id="connect-btn">Connect</button>
		<button id="identify-btn" disabled>Identify</button>

		<div id="messages"></div>

		<form id="message-form">
			<input id="message-input" type="text" placeholder="Type a message..." disabled />
			<button type="submit" disabled>Send</button>
		</form>

		<script>
			let socket;
			const userId = "user-" + Math.random().toString(36).substr(2, 9);
			const conversationId = "conv-" + Math.random().toString(36).substr(2, 9);

			const connectBtn = document.getElementById("connect-btn");
			const identifyBtn = document.getElementById("identify-btn");
			const messagesDiv = document.getElementById("messages");
			const messageForm = document.getElementById("message-form");
			const messageInput = document.getElementById("message-input");
			const sendBtn = messageForm.querySelector("button");

			function addMessage(message, isSystem = false) {
				const messageEl = document.createElement("div");
				messageEl.textContent = message;
				messageEl.style.marginBottom = "8px";
				messageEl.style.padding = "8px";

				if (isSystem) {
					messageEl.style.backgroundColor = "#f8f8f8";
					messageEl.style.color = "#555";
				} else {
					messageEl.style.backgroundColor = "#e6f7ff";
				}

				messagesDiv.appendChild(messageEl);
				messagesDiv.scrollTop = messagesDiv.scrollHeight;
			}

			connectBtn.addEventListener("click", () => {
				// Connect to WebSocket server
				socket = io("http://localhost:3000");

				socket.on("connect", () => {
					addMessage(`Connected with socket ID: ${socket.id}`, true);
					connectBtn.disabled = true;
					identifyBtn.disabled = false;
				});

				socket.on("disconnect", () => {
					addMessage("Disconnected from server", true);
					connectBtn.disabled = false;
					identifyBtn.disabled = true;
					messageInput.disabled = true;
					sendBtn.disabled = true;
				});

				socket.on("message_received", (data) => {
					addMessage(`Assistant: ${data.content}`);
				});

				socket.on("itinerary_generated", (data) => {
					addMessage(`Itinerary generated: ${JSON.stringify(data)}`, true);
				});
			});

			identifyBtn.addEventListener("click", () => {
				socket.emit("identify", { userId }, (response) => {
					if (response.success) {
						addMessage(`Identified as user: ${userId}`, true);
						messageInput.disabled = false;
						sendBtn.disabled = false;
					} else {
						addMessage(`Failed to identify: ${response.error}`, true);
					}
				});
			});

			messageForm.addEventListener("submit", (e) => {
				e.preventDefault();
				const content = messageInput.value.trim();
				if (!content) return;

				socket.emit("send_message", { conversationId, userId, content }, (response) => {
					if (response.success) {
						addMessage(`You: ${content}`);
						messageInput.value = "";
					} else {
						addMessage(`Error sending message: ${response.error}`, true);
					}
				});
			});
		</script>
	</body>
</html>
